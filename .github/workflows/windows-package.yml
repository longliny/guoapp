name: Build Windows packages

on:
  workflow_dispatch:
  push:
    branches: [windows-build]

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install native compiler and media fixture tool
        run: |
          choco install mingw ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $compiler = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\ProgramData\chocolatey\lib\mingw' -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { $compiler = (Get-Command gcc -ErrorAction SilentlyContinue).Source }
          if (-not $compiler) { throw 'MinGW-w64 gcc was not found' }
          Split-Path $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $compiler -dumpmachine
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows toolchain
        run: flutter doctor -v
      - name: Check build scripts
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Resolve dependencies for the current manifest
        run: flutter pub get
      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-dependency-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 14
      - name: Build release package
        id: build
        run: python scripts/build_windows.py ${{ matrix.arguments }}
      - name: Test Flutter widgets without remote images
        run: |
          $variant = @()
          if ('${{ matrix.edition }}' -eq 'zhenguojian') { $variant += '--dart-define=ALL_SOURCES=true' }
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true @variant
          exit $LASTEXITCODE
      - name: Test packaged native core and playback
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/smoke_windows.py ${{ matrix.arguments }}
      - name: Upload package and available smoke report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-windows-x64
          path: |
            dist/windows/*
            build/windows-package-smoke.json
          if-no-files-found: error
          retention-days: 14
